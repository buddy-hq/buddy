name: release-local-macos-arm64-benchmark

on:
  push:
    branches:
      - codex/release-pipeline-refactor
  workflow_dispatch:
    inputs:
      phase:
        description: "Measurement label"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - optimized

concurrency:
  group: release-local-macos-arm64-benchmark
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-current-mac:
    name: build current Mac (ARM64)
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 90
    env:
      BUDDY_CHANNEL: prod
      BUDDY_NODE_ARTIFACT_TARGET_PLATFORM: darwin
      BUDDY_NODE_ARTIFACT_TARGET_ARCH: arm64
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.release-benchmark/bun-cache
      ELECTRON_CACHE: ${{ github.workspace }}/.release-benchmark/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.release-benchmark/electron-builder
      RELEASE_BENCHMARK_OUTPUT: ${{ github.workspace }}/.release-benchmark/metrics.json
      RELEASE_BENCHMARK_PHASE: ${{ github.event.inputs.phase || 'baseline' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Reset benchmark directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${{ runner.temp }}/buddy-release-benchmark"
          mkdir -p \
            "$BUN_INSTALL_CACHE_DIR" \
            "$ELECTRON_CACHE" \
            "$ELECTRON_BUILDER_CACHE"

      - name: Restore current Bun cache
        uses: actions/cache@v5
        with:
          path: ${{ env.BUN_INSTALL_CACHE_DIR }}
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Restore current Electron caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/desktop-electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - name: Run measured release build
        run: bun ./script/benchmark-release-macos-arm64.ts

      - name: Upload benchmark metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-benchmark-${{ env.RELEASE_BENCHMARK_PHASE }}-${{ github.run_id }}
          path: ${{ env.RELEASE_BENCHMARK_OUTPUT }}
          if-no-files-found: error
          retention-days: 7
