name: publish-skill-artifacts

on:
  workflow_call:
    inputs:
      base_fingerprint:
        required: false
        type: string
      publish:
        required: false
        type: boolean
        default: true
      prevalidated:
        required: false
        type: boolean
        default: false
      release_dry_run:
        required: false
        type: boolean
        default: false
      release_repo:
        required: false
        type: string
      release_source_mode:
        required: false
        type: string
      release_source_repository:
        required: false
        type: string
      release_source_sha:
        required: false
        type: string
      release_tag:
        required: false
        type: string
      system_revision:
        required: false
        type: string
    secrets:
      BUDDY_RELEASE_TOKEN:
        required: true
      BUDDY_SKILL_SIGNING_PRIVATE_KEY:
        required: true
      BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      BUDDY_SKILLS_REPOSITORY_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      base_fingerprint:
        description: Existing bundled system-skill fingerprint to target; blank targets this checkout
        required: false
        type: string
      publish:
        description: Publish artifacts after building and verifying them
        required: false
        default: true
        type: boolean
      system_revision:
        description: System pack revision; blank uses the library catalog revision
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-skill-artifacts
  cancel-in-progress: false

env:
  BUN_VERSION: "1.3.13"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_source_sha || github.sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Record or verify desktop release source
        if: ${{ inputs.release_source_mode != '' }}
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ inputs.release_repo }}
          BUDDY_RELEASE_SOURCE_DRY_RUN: ${{ inputs.release_dry_run && '1' || '' }}
          BUDDY_RELEASE_SOURCE_MODE: ${{ inputs.release_source_mode }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ inputs.release_source_repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.release_source_sha }}
          BUDDY_RELEASE_TAG: ${{ inputs.release_tag }}
        run: bun ./script/release-source-metadata.ts

      - if: ${{ !inputs.prevalidated }}
        name: Validate repository and signed skill artifacts
        env:
          BUDDY_SKILL_SIGNING_PRIVATE_KEY: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY }}
          BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run release:validate-skill-artifacts

      - name: Build and optionally publish signed skill artifacts
        env:
          BUDDY_SKILL_SIGNING_PRIVATE_KEY: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY }}
          BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD }}
          BUDDY_SKILLS_REPOSITORY_TOKEN: ${{ secrets.BUDDY_SKILLS_REPOSITORY_TOKEN }}
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          INPUT_BASE_FINGERPRINT: ${{ inputs.base_fingerprint }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          INPUT_SYSTEM_REVISION: ${{ inputs.system_revision }}
        run: |
          args=()
          if [[ "$INPUT_PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          if [[ -n "$INPUT_BASE_FINGERPRINT" ]]; then
            args+=(--base-fingerprint "$INPUT_BASE_FINGERPRINT")
          fi
          if [[ -n "$INPUT_SYSTEM_REVISION" ]]; then
            args+=(--system-revision "$INPUT_SYSTEM_REVISION")
          fi
          bun ./script/publish-skill-artifacts.ts "${args[@]}"
        working-directory: packages/buddy
