name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.13"
  INSTALL_MAX_ATTEMPTS: "3"
  INSTALL_RETRY_DELAY_SECONDS: "10"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ci-bun-v1-${{ env.BUN_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: |
          for ((attempt = 1; attempt <= INSTALL_MAX_ATTEMPTS; attempt++)); do
            if bun install --frozen-lockfile; then
              exit 0
            fi
            if ((attempt == INSTALL_MAX_ATTEMPTS)); then
              exit 1
            fi
            sleep "$INSTALL_RETRY_DELAY_SECONDS"
          done

      - run: bun lint

      - run: bun typecheck

      # Search-backed tests spawn the vendored ripgrep adapter, which downloads a
      # release binary when `rg` is missing from PATH. The test network guard blocks
      # that fetch, so provide ripgrep from the runner instead.
      - name: Install ripgrep
        run: |
          for ((attempt = 1; attempt <= INSTALL_MAX_ATTEMPTS; attempt++)); do
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep; then
              exit 0
            fi
            if ((attempt == INSTALL_MAX_ATTEMPTS)); then
              exit 1
            fi
            sleep "$INSTALL_RETRY_DELAY_SECONDS"
          done

      - run: bun run test
