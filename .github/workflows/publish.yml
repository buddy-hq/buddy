name: publish
run-name: "${{ format('release {0}', github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.ref_name) }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.sha }}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - id: version
        run: bun ./script/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_BUMP: ${{ inputs.bump }}
          BUDDY_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  verify-updater-signing:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Require updater signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for Buddy releases because auto-update support is mandatory."
            exit 1
          fi

  build-sidecar:
    needs:
      - version
      - verify-updater-signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - run: bun run --cwd packages/buddy build:release-sidecars

      - uses: actions/upload-artifact@v4
        with:
          name: buddy-sidecars
          path: packages/buddy/dist/release-sidecars

  build-tauri:
    needs:
      - version
      - verify-updater-signing
      - build-sidecar
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.settings.target }}

      - uses: actions/download-artifact@v4
        with:
          name: buddy-sidecars
          path: packages/buddy/dist/release-sidecars

      - run: bun run --cwd packages/desktop prepare:release
        env:
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          BUDDY_RUST_TARGET: ${{ matrix.settings.target }}
          BUDDY_SIDECAR_ARTIFACT_DIR: ${{ github.workspace }}/packages/buddy/dist/release-sidecars
      - name: Configure macOS signing for the release build
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_SECRET" ]; then
            {
              echo "APPLE_CERTIFICATE<<EOF"
              echo "$APPLE_CERTIFICATE_SECRET"
              echo "EOF"
            } >> "$GITHUB_ENV"

            if [ -n "$APPLE_CERTIFICATE_PASSWORD_SECRET" ]; then
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            fi
          fi

          if [ -n "$APPLE_SIGNING_IDENTITY_SECRET" ]; then
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET" >> "$GITHUB_ENV"
          elif [ -z "$APPLE_CERTIFICATE_SECRET" ]; then
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "Defaulting to ad-hoc Apple signing for unsigned macOS release bundles."
          else
            echo "APPLE_CERTIFICATE is configured; leaving APPLE_SIGNING_IDENTITY unset."
          fi
      - uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        timeout-minutes: 60
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          args: --target ${{ matrix.settings.target }} --config ./src-tauri/tauri.prod.conf.json --verbose
          updaterJsonPreferNsis: true
          releaseId: ${{ needs.version.outputs.release }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseDraft: true
          releaseAssetNamePattern: buddy-desktop-[platform]-[arch][ext]
          releaseCommitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  build-advanced-math:
    needs:
      - version
      - verify-updater-signing
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - id: advanced-math-asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
          BUDDY_RELEASE_VERSION: ${{ needs.version.outputs.version }}
          BUDDY_RUST_TARGET: ${{ matrix.settings.target }}
        run: |
          set -euo pipefail

          echo "restored=false" >> "$GITHUB_OUTPUT"

          current_tag="$BUDDY_RELEASE_TAG"
          previous_tag="$(
            gh release list \
              --repo "$BUDDY_RELEASE_REPO" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 100 \
              --json tagName,publishedAt \
              --jq "[.[] | select(.tagName != \"$current_tag\")] | sort_by(.publishedAt) | last | .tagName // \"\""
          )"

          if [ -z "$previous_tag" ]; then
            echo "No previous stable release available; building advanced math runtime."
            exit 0
          fi

          runtime_paths=(
            "packages/buddy/src/local-runtimes/advanced-math/runtime/main.py"
            "packages/buddy/script/build-advanced-math-runtime.ts"
          )

          if ! git diff --quiet "$previous_tag...$GITHUB_SHA" -- "${runtime_paths[@]}"; then
            echo "Advanced math runtime inputs changed since $previous_tag; building fresh artifacts."
            exit 0
          fi

          executable_name="buddy-advanced-math"
          if [[ "$BUDDY_RUST_TARGET" == *"windows"* ]]; then
            executable_name="buddy-advanced-math.exe"
          fi

          target_pattern="${executable_name}-v*-${BUDDY_RUST_TARGET}.zip"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          if ! gh release download "$previous_tag" --repo "$BUDDY_RELEASE_REPO" --pattern "$target_pattern" --pattern "${target_pattern}.sha256" --dir "$temp_dir"; then
            echo "Failed to download advanced math runtime assets from $previous_tag; building fresh artifacts."
            exit 0
          fi

          previous_bundle="$(find "$temp_dir" -maxdepth 1 -type f -name "$target_pattern" | head -n 1)"
          if [ -z "$previous_bundle" ]; then
            echo "No advanced math runtime bundle found in $previous_tag; building fresh artifacts."
            exit 0
          fi

          previous_checksum="${previous_bundle}.sha256"
          if [ ! -f "$previous_checksum" ]; then
            echo "No advanced math runtime checksum found in $previous_tag; building fresh artifacts."
            exit 0
          fi

          output_dir="packages/buddy/dist/advanced-math-runtime/${BUDDY_RUST_TARGET}"
          mkdir -p "$output_dir"

          current_bundle="${output_dir}/${executable_name}-v${BUDDY_RELEASE_VERSION}-${BUDDY_RUST_TARGET}.zip"
          current_checksum="${current_bundle}.sha256"

          cp "$previous_bundle" "$current_bundle"
          cp "$previous_checksum" "$current_checksum"

          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Reused advanced math runtime assets from $previous_tag."

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        run: bun install

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        run: bun run --cwd packages/buddy build:advanced-math-runtime
        env:
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          BUDDY_RUST_TARGET: ${{ matrix.settings.target }}

      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$BUDDY_RELEASE_TAG" \
            "packages/buddy/dist/advanced-math-runtime/${{ matrix.settings.target }}"/* \
            --clobber \
            --repo "$BUDDY_RELEASE_REPO"

  publish:
    needs:
      - version
      - build-tauri
      - build-advanced-math
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - run: bun install

      - run: bun ./script/publish.ts
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          BUDDY_RELEASE: ${{ needs.version.outputs.release }}
