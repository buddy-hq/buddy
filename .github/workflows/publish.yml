name: publish
run-name: "${{ format('release {0}', github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.ref_name) }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.sha }}

permissions:
  contents: write

env:
  BUN_VERSION: "1.3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - name: Verify mac updater signer tooling
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd packages/desktop-electron verify:update-signing

      - id: version
        run: bun ./script/version.ts
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_BUMP: ${{ inputs.bump }}
          BUDDY_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      release_repo: ${{ steps.version.outputs.release_repo }}
      repo: ${{ steps.version.outputs.release_repo }}
      source_repo: ${{ steps.version.outputs.source_repo }}

  smoke-node-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - run: bun run --cwd packages/desktop-electron smoke:recovery-policy

      - run: bun run --cwd packages/buddy build:node

      - run: bun run --cwd packages/buddy smoke:node

  build-electron-macos-arm64:
    needs:
      - version
    runs-on: macos-latest
    env:
      BUDDY_CHANNEL: prod
      BUDDY_NODE_ARTIFACT_TARGET_PLATFORM: darwin
      BUDDY_NODE_ARTIFACT_TARGET_ARCH: arm64
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/desktop-electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - run: bun install

      - run: bun run sdk:generate

      - run: bun run --cwd packages/desktop-electron prepare:release
        env:
          BUDDY_VERSION: ${{ needs.version.outputs.version }}

      - name: Build Electron app for darwin-arm64
        run: bun run --cwd packages/desktop-electron build

      - name: Smoke Electron backend utility
        run: bun run --cwd packages/desktop-electron smoke:backend-utility

      - run: bunx --bun electron-builder --mac --arm64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v6
        with:
          name: electron-package-aarch64-apple-darwin
          path: |
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.zip
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.blockmap
          compression-level: 0
          retention-days: 1

      - name: Upload latest yml
        uses: actions/upload-artifact@v6
        with:
          name: latest-yml-aarch64-apple-darwin
          path: |
            packages/desktop-electron/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 1

  build-electron-macos-x64:
    needs:
      - version
    runs-on: macos-15-intel
    env:
      BUDDY_CHANNEL: prod
      BUDDY_NODE_ARTIFACT_TARGET_PLATFORM: darwin
      BUDDY_NODE_ARTIFACT_TARGET_ARCH: x64
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/desktop-electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - run: bun install

      - run: bun run sdk:generate

      - run: bun run --cwd packages/desktop-electron prepare:release
        env:
          BUDDY_VERSION: ${{ needs.version.outputs.version }}

      - name: Build Electron app for darwin-x64
        run: bun run --cwd packages/desktop-electron build

      - name: Smoke Electron backend utility
        run: bun run --cwd packages/desktop-electron smoke:backend-utility

      - run: bunx --bun electron-builder --mac --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v6
        with:
          name: electron-package-x86_64-apple-darwin
          path: |
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.zip
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.blockmap
          compression-level: 0
          retention-days: 1

      - name: Upload latest yml
        uses: actions/upload-artifact@v6
        with:
          name: latest-yml-x86_64-apple-darwin
          path: |
            packages/desktop-electron/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 1

  build-electron-windows-x64:
    needs:
      - version
    runs-on: windows-2025-vs2026
    env:
      BUDDY_CHANNEL: prod
      BUDDY_NODE_ARTIFACT_TARGET_PLATFORM: win32
      BUDDY_NODE_ARTIFACT_TARGET_ARCH: x64
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: ${{ runner.os }}-electron-builder-${{ hashFiles('packages/desktop-electron/package.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-builder-

      - run: bun install

      - run: bun run sdk:generate

      - run: bun run --cwd packages/desktop-electron prepare:release
        env:
          BUDDY_VERSION: ${{ needs.version.outputs.version }}

      - name: Build Electron app for win32-x64
        run: bun run --cwd packages/desktop-electron build

      - name: Smoke Electron backend utility
        run: bun run --cwd packages/desktop-electron smoke:backend-utility

      - run: bunx --bun electron-builder --win --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v6
        with:
          name: electron-package-x86_64-pc-windows-msvc
          path: |
            packages/desktop-electron/dist/*.dmg
            packages/desktop-electron/dist/*.zip
            packages/desktop-electron/dist/*.exe
            packages/desktop-electron/dist/*.blockmap
          compression-level: 0
          retention-days: 1

      - name: Upload latest yml
        uses: actions/upload-artifact@v6
        with:
          name: latest-yml-x86_64-pc-windows-msvc
          path: |
            packages/desktop-electron/dist/latest*.yml
          if-no-files-found: ignore
          retention-days: 1

  upload-electron-release:
    needs:
      - version
      - smoke-node-backend
      - build-electron-macos-arm64
      - build-electron-macos-x64
      - build-electron-windows-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - uses: actions/download-artifact@v7
        with:
          pattern: electron-package-*
          path: electron-dist
          merge-multiple: true

      - uses: actions/download-artifact@v7
        with:
          pattern: latest-yml-*
          path: latest-yml

      - name: Upload packaged binaries to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find electron-dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' \))
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No Electron artifacts found"
            exit 1
          fi
          gh release upload "$BUDDY_RELEASE_TAG" \
            "${artifacts[@]}" \
            scripts/install-buddy-macos.sh \
            scripts/install-buddy-windows.ps1 \
            --clobber \
            --repo "$BUDDY_RELEASE_REPO"

      - name: Finalize and upload latest yml
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          GH_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          LATEST_YML_DIR: ${{ github.workspace }}/latest-yml
          ELECTRON_DIST_DIR: ${{ github.workspace }}/electron-dist
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bun ./packages/desktop-electron/scripts/finalize-latest-yml.ts

      - name: Finalize and upload latest mac json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          GH_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          LATEST_YML_DIR: ${{ github.workspace }}/latest-yml
          ELECTRON_DIST_DIR: ${{ github.workspace }}/electron-dist
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bun ./packages/desktop-electron/scripts/finalize-latest-mac-json.ts

      - name: Finalize and upload recovery policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          GH_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bun ./packages/desktop-electron/scripts/finalize-recovery-policy.ts

  build-advanced-math:
    needs:
      - version
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - id: runtime-version
        shell: bash
        run: |
          runtime_version="$(
            bun ./packages/buddy/script/print-advanced-math-version.ts
          )"
          if [ -z "$runtime_version" ]; then
            echo "Failed to resolve advanced math runtime version"
            exit 1
          fi
          echo "version=$runtime_version" >> "$GITHUB_OUTPUT"
          echo "Runtime version: $runtime_version"

      - id: advanced-math-asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
          BUDDY_RUST_TARGET: ${{ matrix.settings.target }}
          RUNTIME_VERSION: ${{ steps.runtime-version.outputs.version }}
        run: |
          set -euo pipefail

          echo "restored=false" >> "$GITHUB_OUTPUT"

          current_tag="$BUDDY_RELEASE_TAG"
          previous_tag="$(
            gh release list \
              --repo "$BUDDY_RELEASE_REPO" \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 100 \
              --json tagName,publishedAt \
              --jq "[.[] | select(.tagName != \"$current_tag\")] | sort_by(.publishedAt) | last | .tagName // \"\""
          )"

          if [ -z "$previous_tag" ]; then
            echo "No previous stable release available; building advanced math runtime."
            exit 0
          fi

          runtime_paths=(
            "packages/buddy/src/local-runtimes/advanced-math/runtime/main.py"
            "packages/buddy/script/build-advanced-math-runtime.ts"
            "packages/buddy/src/local-runtimes/advanced-math/version.ts"
          )

          if ! git diff --quiet "$previous_tag...$GITHUB_SHA" -- "${runtime_paths[@]}"; then
            echo "Advanced math runtime inputs changed since $previous_tag; building fresh artifacts."
            exit 0
          fi

          executable_name="buddy-advanced-math"
          if [[ "$BUDDY_RUST_TARGET" == *"windows"* ]]; then
            executable_name="buddy-advanced-math.exe"
          fi

          # Assets use runtime version, not app version
          asset_name="${executable_name}-v${RUNTIME_VERSION}-${BUDDY_RUST_TARGET}.zip"
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          if ! gh release download "$previous_tag" --repo "$BUDDY_RELEASE_REPO" --pattern "$asset_name" --pattern "${asset_name}.sha256" --dir "$temp_dir"; then
            echo "Failed to download advanced math runtime assets from $previous_tag; building fresh artifacts."
            exit 0
          fi

          previous_bundle="$temp_dir/$asset_name"
          if [ ! -f "$previous_bundle" ]; then
            echo "No advanced math runtime bundle found in $previous_tag; building fresh artifacts."
            exit 0
          fi

          previous_checksum="$temp_dir/${asset_name}.sha256"
          if [ ! -f "$previous_checksum" ]; then
            echo "No advanced math runtime checksum found in $previous_tag; building fresh artifacts."
            exit 0
          fi

          output_dir="packages/buddy/dist/advanced-math-runtime/${BUDDY_RUST_TARGET}"
          mkdir -p "$output_dir"

          cp "$previous_bundle" "$output_dir/$asset_name"
          cp "$previous_checksum" "$output_dir/${asset_name}.sha256"

          echo "restored=true" >> "$GITHUB_OUTPUT"
          echo "Reused advanced math runtime assets from $previous_tag (runtime version $RUNTIME_VERSION)."

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - if: steps.advanced-math-asset.outputs.restored != 'true'
        run: bun run --cwd packages/buddy build:advanced-math-runtime
        env:
          BUDDY_RUST_TARGET: ${{ matrix.settings.target }}

      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$BUDDY_RELEASE_TAG" \
            "packages/buddy/dist/advanced-math-runtime/${{ matrix.settings.target }}"/* \
            --clobber \
            --repo "$BUDDY_RELEASE_REPO"

  build-standards:
    needs:
      - version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - run: bun run --cwd packages/buddy verify:knowledge-graph

      - shell: bash
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          gh release upload "$BUDDY_RELEASE_TAG" \
            packages/buddy/resources/knowledge-graph/learning-commons-knowledge-graph.db.zst \
            packages/buddy/resources/knowledge-graph/learning-commons-knowledge-graph.db.zst.sha256 \
            packages/buddy/resources/knowledge-graph/learning-commons-knowledge-graph.db.json \
            --clobber \
            --repo "$BUDDY_RELEASE_REPO"

  publish:
    needs:
      - version
      - upload-electron-release
      - build-advanced-math
      - build-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install

      - run: bun ./script/publish.ts
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_VERSION: ${{ needs.version.outputs.version }}
          BUDDY_RELEASE: ${{ needs.version.outputs.release }}
          BUDDY_RELEASE_REPO: ${{ needs.version.outputs.release_repo }}
