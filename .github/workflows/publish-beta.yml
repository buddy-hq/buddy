name: publish-beta
run-name: "${{ format('beta release v{0}', inputs.version) }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact semver without the v prefix"
        required: true
        type: string
      source_sha:
        description: "Exact green beta commit to package"
        required: true
        type: string
      build_macos_arm64:
        description: "Build macOS Apple Silicon"
        required: false
        default: true
        type: boolean
      build_macos_x64:
        description: "Build macOS Intel"
        required: false
        default: true
        type: boolean
      build_windows_x64:
        description: "Build Windows x64"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Run release pipeline without creating, uploading, publishing, or syncing release state"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-beta
  cancel-in-progress: false

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish-shared.yml
    with:
      channel: beta
      build_macos_arm64: ${{ inputs.build_macos_arm64 }}
      build_macos_x64: ${{ inputs.build_macos_x64 }}
      build_windows_x64: ${{ inputs.build_windows_x64 }}
      dry_run: ${{ inputs.dry_run }}
      source_sha: ${{ inputs.source_sha }}
      version: ${{ inputs.version }}
    secrets:
      BUDDY_RELEASE_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.BUDDY_BETA_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BUDDY_BETA_UPDATER_PRIVATE_KEY_PASSWORD }}
