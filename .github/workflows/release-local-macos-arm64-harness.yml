name: release-local-macos-arm64-harness

on:
  push:
    branches:
      - codex/release-pipeline-refactor
  workflow_dispatch:

concurrency:
  group: release-local-macos-arm64-harness
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: "1.3.14"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CURRENT_METRICS: docs/features/release/pipeline/measurements/local-runner-macos-arm64-current-${{ github.run_id }}.json
  OPTIMIZED_METRICS: docs/features/release/pipeline/measurements/local-runner-macos-arm64-optimized-${{ github.run_id }}.json
  COMPARISON_METRICS: docs/features/release/pipeline/measurements/local-runner-macos-arm64-comparison-${{ github.run_id }}.json

jobs:
  macos-arm64:
    name: macOS ARM64 local runner release units
    runs-on:
      - self-hosted
      - macOS
      - ARM64
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          clean: true
          ref: ${{ github.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Initialize current profile
        run: bun ./script/release-local-runner-harness.ts init --profile current --output "$CURRENT_METRICS"

      - name: Reset local release outputs for current profile
        run: bun ./script/release-local-runner-harness.ts reset

      - name: "Current: measure install dependencies"
        run: bun ./script/release-local-runner-harness.ts run --name "install dependencies" -- bun install --os=darwin --cpu=arm64

      - name: "Current: measure SDK generation"
        run: bun ./script/release-local-runner-harness.ts run --name "generate SDK" -- bun run sdk:generate

      - name: "Current: measure release preparation"
        run: bun ./script/release-local-runner-harness.ts run --name "prepare release" -- bun run --cwd packages/desktop-electron prepare:release

      - name: "Current: measure Electron build"
        run: bun ./script/release-local-runner-harness.ts run --name "build Electron app" -- bun run --cwd packages/desktop-electron build

      - name: "Current: measure backend utility smoke"
        run: bun ./script/release-local-runner-harness.ts run --name "smoke Electron backend utility" -- bun run --cwd packages/desktop-electron smoke:backend-utility

      - name: "Current: measure Electron packaging"
        run: bun ./script/release-local-runner-harness.ts run --name "package Electron app" --cwd packages/desktop-electron -- bunx --bun electron-builder --mac --arm64 --publish never --config electron-builder.config.ts

      - name: Snapshot current profile metrics
        if: always()
        run: bun ./script/release-local-runner-harness.ts snapshot

      - name: Initialize optimized profile
        run: bun ./script/release-local-runner-harness.ts init --profile optimized --output "$OPTIMIZED_METRICS"

      - name: Reset local release outputs for optimized profile
        run: bun ./script/release-local-runner-harness.ts reset

      - name: "Optimized: measure install dependencies"
        run: bun ./script/release-local-runner-harness.ts run --name "install dependencies" -- bun install --os=darwin --cpu=arm64

      - name: "Optimized: measure SDK generation"
        run: bun ./script/release-local-runner-harness.ts run --name "generate SDK" -- bun run sdk:generate

      - name: "Optimized: measure release preparation"
        run: bun ./script/release-local-runner-harness.ts run --name "prepare release" -- bun run --cwd packages/desktop-electron prepare:release

      - name: "Optimized: measure Electron build"
        run: bun ./script/release-local-runner-harness.ts run --name "build Electron app" -- bun run --cwd packages/desktop-electron build

      - name: "Optimized: measure backend utility smoke"
        run: bun ./script/release-local-runner-harness.ts run --name "smoke Electron backend utility" -- bun run --cwd packages/desktop-electron smoke:backend-utility

      - name: "Optimized: measure Electron packaging"
        run: bun ./script/release-local-runner-harness.ts run --name "package Electron app" --cwd packages/desktop-electron -- bunx --bun electron-builder --mac --arm64 --publish never --config electron-builder.config.ts

      - name: Snapshot optimized profile metrics
        if: always()
        run: bun ./script/release-local-runner-harness.ts snapshot

      - name: Compare local profile metrics
        if: always()
        run: bun ./script/release-local-runner-harness.ts compare --baseline "$CURRENT_METRICS" --candidate "$OPTIMIZED_METRICS" --output "$COMPARISON_METRICS"
