name: publish-shared

on:
  workflow_call:
    inputs:
      build_macos_arm64:
        default: true
        required: false
        type: boolean
      build_macos_x64:
        default: true
        required: false
        type: boolean
      build_windows_x64:
        default: true
        required: false
        type: boolean
      dry_run:
        default: false
        required: false
        type: boolean
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      BUDDY_RELEASE_TOKEN:
        required: true
      BUDDY_SKILL_SIGNING_PRIVATE_KEY:
        required: true
      BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      BUDDY_SKILLS_REPOSITORY_TOKEN:
        required: true
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PATH:
        required: false

permissions:
  actions: read
  checks: read
  contents: write

env:
  BUN_VERSION: "1.3.13"
  ELECTRON_BUILD_NODE_OPTIONS: "--max-old-space-size=4096"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PYTHON_VERSION: "3.12"
  RUNNER_MACOS_ARM64: "macos-26"
  RUNNER_MACOS_X64: "macos-26-intel"
  RUNNER_WINDOWS_X64: "windows-2025-vs2026"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build_macos_arm64: ${{ steps.targets.outputs.build_macos_arm64 }}
      build_macos_x64: ${{ steps.targets.outputs.build_macos_x64 }}
      build_standards: ${{ steps.build-plan.outputs.build_standards }}
      build_windows_x64: ${{ steps.targets.outputs.build_windows_x64 }}
      electron_matrix: ${{ steps.build-plan.outputs.electron_matrix }}
      frozen: ${{ steps.build-plan.outputs.frozen }}
      any_electron: ${{ steps.build-plan.outputs.any_electron }}
      plan_digest: ${{ steps.release-plan.outputs.plan_digest }}
      release: ${{ steps.version.outputs.release }}
      release_date: ${{ steps.release-plan.outputs.release_date }}
      release_repo: ${{ steps.version.outputs.release_repo }}
      source_repo: ${{ steps.version.outputs.source_repo }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: targets
        name: Validate release inputs
        shell: bash
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must be an exact semver without a v prefix" >&2
            exit 1
          fi
          if [[ ! "$INPUT_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_sha must be a full 40-character commit SHA" >&2
            exit 1
          fi
          if [[ "${{ inputs.build_macos_arm64 }}" != "true" && "${{ inputs.build_macos_x64 }}" != "true" && "${{ inputs.build_windows_x64 }}" != "true" ]]; then
            echo "At least one release target must be selected." >&2
            exit 1
          fi
          {
            echo "build_macos_arm64=${{ inputs.build_macos_arm64 }}"
            echo "build_macos_x64=${{ inputs.build_macos_x64 }}"
            echo "build_windows_x64=${{ inputs.build_windows_x64 }}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify green main source
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: bun ./script/release/preflight.ts

      - id: version
        name: Resolve release draft
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_VERSION: ${{ inputs.version }}
        run: bun ./script/version.ts

      - id: release-plan
        name: Create or verify immutable release plan
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_BUN_VERSION: ${{ env.BUN_VERSION }}
          BUDDY_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUDDY_RELEASE_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          BUDDY_RELEASE_REPO: ${{ steps.version.outputs.release_repo }}
          BUDDY_RELEASE_RUNNER_MACOS_ARM64: ${{ env.RUNNER_MACOS_ARM64 }}
          BUDDY_RELEASE_RUNNER_MACOS_X64: ${{ env.RUNNER_MACOS_X64 }}
          BUDDY_RELEASE_RUNNER_WINDOWS_X64: ${{ env.RUNNER_WINDOWS_X64 }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ inputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ inputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ steps.version.outputs.version }}
        run: bun ./script/release/plan.ts

      - if: ${{ !inputs.dry_run }}
        name: Record immutable release source
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_REPO: ${{ steps.version.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_MODE: record
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bun ./script/release-source-metadata.ts

      - id: build-plan
        name: Resolve recoverable build plan
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ steps.release-plan.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ steps.version.outputs.release_repo }}
          BUDDY_RELEASE_RUNNER_MACOS_ARM64: ${{ env.RUNNER_MACOS_ARM64 }}
          BUDDY_RELEASE_RUNNER_MACOS_X64: ${{ env.RUNNER_MACOS_X64 }}
          BUDDY_RELEASE_RUNNER_WINDOWS_X64: ${{ env.RUNNER_WINDOWS_X64 }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ inputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ inputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ steps.version.outputs.version }}
        run: bun ./script/release/build-plan.ts non-math

  prepare-math:
    needs: preflight
    if: needs.preflight.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      any_math: ${{ steps.build-plan.outputs.any_math }}
      math_matrix: ${{ steps.build-plan.outputs.math_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: reuse-math
        name: Reuse unchanged advanced math runtimes
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_RUNNER_MACOS_ARM64: ${{ env.RUNNER_MACOS_ARM64 }}
          BUDDY_RELEASE_RUNNER_MACOS_X64: ${{ env.RUNNER_MACOS_X64 }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ inputs.build_macos_x64 }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./script/release/reuse-advanced-math.ts

      - id: build-plan
        name: Resolve recoverable advanced math plan
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_REUSED_MATH_MACOS_ARM64: ${{ steps.reuse-math.outputs.reused_macos_arm64 }}
          BUDDY_RELEASE_REUSED_MATH_MACOS_X64: ${{ steps.reuse-math.outputs.reused_macos_x64 }}
          BUDDY_RELEASE_RUNNER_MACOS_ARM64: ${{ env.RUNNER_MACOS_ARM64 }}
          BUDDY_RELEASE_RUNNER_MACOS_X64: ${{ env.RUNNER_MACOS_X64 }}
          BUDDY_RELEASE_RUNNER_WINDOWS_X64: ${{ env.RUNNER_WINDOWS_X64 }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ inputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ inputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ inputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./script/release/build-plan.ts advanced-math

  validate-skills:
    needs: preflight
    if: needs.preflight.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build signed skill artifacts
        env:
          BUDDY_SKILL_SIGNING_PRIVATE_KEY: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY }}
          BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run --cwd packages/buddy skill:artifacts:build

  validate-updater:
    needs: preflight
    if: needs.preflight.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify updater signer tooling
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
        run: bun run --cwd packages/desktop-electron verify:update-signing

      - run: bun run --cwd packages/desktop-electron smoke:recovery-policy

      - name: Check omitted target manifest feasibility
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_CHECK_ONLY: "1"
          BUDDY_RELEASE_DATE: ${{ needs.preflight.outputs.release_date }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./packages/desktop-electron/scripts/finalize-target-update-manifests.ts

  validate-backend:
    needs: preflight
    if: needs.preflight.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun run --cwd packages/buddy build:node
      - run: bun run --cwd packages/buddy smoke:node

  build-electron:
    needs:
      - preflight
      - validate-skills
      - validate-updater
      - validate-backend
    if: needs.preflight.outputs.any_electron == 'true'
    name: Electron (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.electron_matrix) }}
    env:
      BUDDY_CHANNEL: prod
      BUDDY_NODE_ARTIFACT_TARGET_ARCH: ${{ matrix.architecture }}
      BUDDY_NODE_ARTIFACT_TARGET_PLATFORM: ${{ matrix.platform }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install: "false"

      - id: cache-versions
        run: bun ./script/release-cache-versions.ts

      - uses: actions/cache@v5
        with:
          path: |
            .cache/electron
            .cache/electron-builder
          key: release-electron-v1-${{ runner.os }}-${{ runner.arch }}-electron-${{ steps.cache-versions.outputs.electron }}-builder-${{ steps.cache-versions.outputs.electron_builder }}

      - name: Install target dependencies
        env:
          TARGET_ARCHITECTURE: ${{ matrix.architecture }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          args=(--frozen-lockfile)
          if [[ "$TARGET_PLATFORM" == "darwin" ]]; then
            args+=(--os=darwin --cpu="$TARGET_ARCHITECTURE")
          fi
          bun install "${args[@]}"

      - name: Build and smoke target
        env:
          BUDDY_RELEASE_BUILD_TARGET: ${{ matrix.target }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          NODE_OPTIONS: ${{ env.ELECTRON_BUILD_NODE_OPTIONS }}
        run: bun ./packages/desktop-electron/scripts/build-release-target.ts --target "$BUDDY_RELEASE_BUILD_TARGET"

      - if: ${{ inputs.dry_run }}
        name: Validate target update manifest
        env:
          BUDDY_RELEASE_DATE: ${{ needs.preflight.outputs.release_date }}
          BUDDY_RELEASE_DRY_RUN: "1"
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SELECTED_TARGETS_ONLY: "1"
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ matrix.target == 'macos-arm64' && 'true' || 'false' }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ matrix.target == 'macos-x64' && 'true' || 'false' }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ matrix.target == 'windows-x64' && 'true' || 'false' }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          ELECTRON_DIST_DIR: ${{ github.workspace }}/packages/desktop-electron/dist
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
        run: bun ./packages/desktop-electron/scripts/finalize-target-update-manifests.ts

      - if: ${{ !inputs.dry_run }}
        name: Upload and checkpoint target
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_ASSET_DIR: packages/desktop-electron/dist
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CHECKPOINT_TARGET: ${{ matrix.checkpoint }}
        run: bun ./script/release/checkpoint.ts record "$RELEASE_CHECKPOINT_TARGET"

  build-advanced-math:
    needs:
      - preflight
      - prepare-math
      - validate-skills
      - validate-updater
      - validate-backend
    if: needs.prepare-math.outputs.any_math == 'true'
    name: Advanced math (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-math.outputs.math_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/pip
          key: release-pip-v1-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-${{ hashFiles('packages/buddy/script/build-advanced-math-runtime.ts') }}
          restore-keys: |
            release-pip-v1-${{ env.PYTHON_VERSION }}-${{ runner.arch }}-

      - name: Build native runtime
        env:
          BUDDY_RUST_TARGET: ${{ matrix.target }}
        run: bun run --cwd packages/buddy build:advanced-math-runtime

      - if: ${{ !inputs.dry_run }}
        name: Upload and checkpoint native runtime
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_ASSET_DIR: packages/buddy/dist/advanced-math-runtime/${{ matrix.target }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          RELEASE_CHECKPOINT_TARGET: ${{ matrix.checkpoint }}
        run: bun ./script/release/checkpoint.ts record "$RELEASE_CHECKPOINT_TARGET"

  build-standards:
    needs:
      - preflight
      - validate-skills
      - validate-updater
      - validate-backend
    if: needs.preflight.outputs.build_standards == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun run --cwd packages/buddy verify:knowledge-graph

      - if: ${{ !inputs.dry_run }}
        name: Upload and checkpoint standards
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_ASSET_DIR: packages/buddy/resources/knowledge-graph
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./script/release/checkpoint.ts record standards

  publish-skill-artifacts:
    needs:
      - preflight
      - finalize-and-publish
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      needs.finalize-and-publish.result == 'success'
    uses: ./.github/workflows/publish-skill-artifacts.yml
    with:
      prevalidated: true
      publish: ${{ !inputs.dry_run }}
      release_dry_run: ${{ inputs.dry_run }}
      release_source_repository: ${{ needs.preflight.outputs.source_repo }}
      release_source_sha: ${{ inputs.source_sha }}
    secrets:
      BUDDY_SKILL_SIGNING_PRIVATE_KEY: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY }}
      BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.BUDDY_SKILL_SIGNING_PRIVATE_KEY_PASSWORD }}
      BUDDY_SKILLS_REPOSITORY_TOKEN: ${{ secrets.BUDDY_SKILLS_REPOSITORY_TOKEN }}

  finalize-and-publish:
    needs:
      - preflight
      - prepare-math
      - validate-skills
      - validate-updater
      - validate-backend
      - build-electron
      - build-advanced-math
      - build-standards
    if: |
      always() &&
      needs.preflight.result == 'success' &&
      (needs.prepare-math.result == 'success' || (needs.preflight.outputs.frozen == 'true' && needs.prepare-math.result == 'skipped')) &&
      (needs.validate-skills.result == 'success' || (needs.preflight.outputs.frozen == 'true' && needs.validate-skills.result == 'skipped')) &&
      (needs.validate-updater.result == 'success' || (needs.preflight.outputs.frozen == 'true' && needs.validate-updater.result == 'skipped')) &&
      (needs.validate-backend.result == 'success' || (needs.preflight.outputs.frozen == 'true' && needs.validate-backend.result == 'skipped')) &&
      (needs.build-electron.result == 'success' || needs.build-electron.result == 'skipped') &&
      (needs.build-advanced-math.result == 'success' || needs.build-advanced-math.result == 'skipped') &&
      (needs.build-standards.result == 'success' || needs.build-standards.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - uses: ./.github/actions/setup-release-runtime
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - id: freeze
        if: ${{ !inputs.dry_run }}
        name: Detect a completed immutable draft
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./script/release/freeze.ts inspect

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Download selected update assets from draft
        env:
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          ELECTRON_DIST_DIR: ${{ runner.temp }}/electron-dist
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
        run: bun ./packages/desktop-electron/scripts/download-release-update-assets.ts

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Upload installer scripts
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: >
          bun ./script/release/assets.ts upload
          --repo "$RELEASE_REPO"
          --tag "$RELEASE_TAG"
          scripts/install-buddy-macos.sh
          scripts/install-buddy-windows.ps1

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Finalize signed target update manifests
        env:
          BUDDY_RELEASE_DATE: ${{ needs.preflight.outputs.release_date }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          ELECTRON_DIST_DIR: ${{ runner.temp }}/electron-dist
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
        run: bun ./packages/desktop-electron/scripts/finalize-target-update-manifests.ts

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Finalize signed recovery policy
        env:
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          GH_REPO: ${{ needs.preflight.outputs.release_repo }}
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
        run: bun ./packages/desktop-electron/scripts/finalize-recovery-policy.ts

      - if: ${{ inputs.dry_run }}
        name: Finalize dry-run recovery policy
        env:
          BUDDY_UPDATE_SKIP_UPLOAD: "1"
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PATH }}
        run: bun ./packages/desktop-electron/scripts/finalize-recovery-policy.ts

      - if: ${{ inputs.dry_run }}
        name: Dry-run cost report
        env:
          BUDDY_RELEASE_TARGET_MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          BUDDY_RELEASE_TARGET_MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          BUDDY_RELEASE_TARGET_WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
          BUDDY_RELEASE_TRANSPORT: publish/direct-release-uploads
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: bun ./script/release-dry-run-report.ts

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Deep-verify downloaded draft assets
        env:
          MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/electron-dist
          RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
        run: >
          bun ./script/verify-release-assets.ts
          --draft
          --asset-dir "$RELEASE_ASSET_DIR"
          --repo "$RELEASE_REPO"
          --tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --plan-digest "$PLAN_DIGEST"
          --macos-arm64 "$MACOS_ARM64"
          --macos-x64 "$MACOS_X64"
          --windows-x64 "$WINDOWS_X64"

      - if: ${{ !inputs.dry_run && steps.freeze.outputs.frozen != 'true' }}
        name: Freeze verified release bytes
        env:
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
        run: bun ./script/release/freeze.ts record

      - if: ${{ !inputs.dry_run }}
        name: Create or verify source provenance tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUDDY_RELEASE_SOURCE_REPOSITORY: ${{ github.repository }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: bun ./script/release-source-tag.ts

      - if: ${{ !inputs.dry_run }}
        name: Publish Preview
        env:
          BUDDY_RELEASE: ${{ needs.preflight.outputs.release }}
          BUDDY_RELEASE_PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          BUDDY_RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          BUDDY_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          BUDDY_VERSION: ${{ needs.preflight.outputs.version }}
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
        run: bun ./script/publish.ts

      - if: ${{ !inputs.dry_run }}
        name: Verify published Preview bytes
        env:
          BUDDY_SOURCE_GH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.BUDDY_RELEASE_TOKEN }}
          MACOS_ARM64: ${{ needs.preflight.outputs.build_macos_arm64 }}
          MACOS_X64: ${{ needs.preflight.outputs.build_macos_x64 }}
          PLAN_DIGEST: ${{ needs.preflight.outputs.plan_digest }}
          RELEASE_ASSET_DIR: ${{ runner.temp }}/electron-dist
          RELEASE_REPO: ${{ needs.preflight.outputs.release_repo }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          WINDOWS_X64: ${{ needs.preflight.outputs.build_windows_x64 }}
        run: >
          bun ./script/verify-release-assets.ts
          --asset-dir "$RELEASE_ASSET_DIR"
          --repo "$RELEASE_REPO"
          --tag "$RELEASE_TAG"
          --source-sha "$SOURCE_SHA"
          --plan-digest "$PLAN_DIGEST"
          --macos-arm64 "$MACOS_ARM64"
          --macos-x64 "$MACOS_X64"
          --windows-x64 "$WINDOWS_X64"
