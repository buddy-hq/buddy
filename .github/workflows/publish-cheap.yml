name: publish-cheap
run-name: "${{ format('release {0}', github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.ref_name) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string
      build_macos_arm64:
        description: "Build macOS Apple Silicon"
        required: false
        default: true
        type: boolean
      build_macos_x64:
        description: "Build macOS Intel"
        required: false
        default: true
        type: boolean
      build_windows_x64:
        description: "Build Windows x64"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Run release pipeline without creating, uploading, publishing, or syncing release state"
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref_type == 'tag' && github.ref_name || inputs.version || inputs.bump || github.sha }}

permissions:
  actions: read
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish-shared.yml
    with:
      build_macos_arm64: ${{ inputs.build_macos_arm64 }}
      build_macos_x64: ${{ inputs.build_macos_x64 }}
      build_windows_x64: ${{ inputs.build_windows_x64 }}
      bump: ${{ github.event.inputs.bump || '' }}
      direct_release_uploads: true
      dry_run: ${{ inputs.dry_run }}
      version: ${{ github.event.inputs.version || '' }}
    secrets: inherit
