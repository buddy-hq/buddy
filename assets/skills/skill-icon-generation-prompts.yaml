schemaVersion: 1

# Exact prompts are reconstructed as: templates[template] + "\n" + body.
templates:
  product-icon-v0: |-
    Use case: stylized-concept
    Asset type: polished desktop app skill icon source
    Scene/backdrop: a perfectly flat solid #00FF00 chroma-key canvas visible only outside the app icon. It must have no shadows, gradients, texture, floor, or reflections.
    Structure: exactly three layers: exterior chroma canvas; one complete opaque regular rounded-square icon base; one centered raised subject on that base.
    Base invariants: complete, centered, symmetrical rounded square with four identical corners and an unbroken silhouette. Never fold, clip, bend, cut, notch, hollow, warp, or deform it. Show the entire base with generous exterior padding.
    Style/medium: fully finished high-quality 3D product icon with solid tactile materials, carefully modeled depth, soft studio light on the icon, and short contact shadows only between internal layers.
    Composition: square canvas, centered front view with slight dimensional depth, one bold subject readable at small size.
    Constraints: no text, no brands, no watermark, no glass, no glow, no transparent material, no green within the icon, and no cast shadow on the chroma canvas. Let the model choose a harmonious palette.
  product-icon-v1: |-
    Use case: stylized-concept
    Asset type: polished desktop app skill icon source
    Scene/backdrop: a perfectly flat solid #00FF00 chroma-key canvas visible only outside the app icon, with no shadows, gradients, texture, floor, or reflections.
    Structure: exactly three layers: the exterior chroma canvas; one complete opaque regular rounded-square icon base; one centered raised subject on that base.
    Base invariants: complete, centered, symmetrical rounded square with four identical corners and an unbroken silhouette. Never fold, clip, bend, cut, notch, hollow, warp, or deform it. Show the entire base with generous exterior padding.
    Style/medium: fully finished high-quality 3D product icon with solid tactile materials, carefully modeled depth, soft studio light on the icon, and short contact shadows only between internal layers.
    Composition: square canvas, centered front view with slight dimensional depth, one bold subject readable at small size.
    Color handling: let the model choose a harmonious palette from the subject. Reserve exact #00FF00 exclusively for the exterior chroma canvas.
    Constraints: no text, letters, numbers, brands, logos, watermark, glass, glow, transparent icon materials, cast shadow on the chroma canvas, or extra unrelated objects.
  product-icon-v2: |-
    Use case: stylized-concept
    Asset type: polished desktop app skill icon source
    Scene/backdrop: a perfectly flat solid #00FF00 chroma-key canvas visible only outside the app icon, with no shadows, gradients, texture, floor, or reflections.
    Structure: exactly three layers: the exterior chroma canvas; one complete opaque regular rounded-square icon base; one centered raised subject on that base.
    Base invariants: complete, centered, symmetrical rounded square with four identical corners and an unbroken silhouette. Never fold, clip, bend, cut, notch, hollow, warp, or deform it. Show the entire base with generous exterior padding.
    Subject invariants: use the specified physical metaphor. Do not turn the subject into generic paper, a floating card, a plaque, a dog-eared page, or a folded sheet. Any required document-like surface must be rigid, flat, unbent, and have four intact corners.
    Style/medium: fully finished high-quality 3D product icon with solid tactile materials, carefully modeled depth, soft studio light on the icon, and short contact shadows only between internal layers.
    Composition: square canvas, centered front view with slight dimensional depth, one bold subject readable at small size.
    Palette handling: follow the single broad base-color cue, then choose supporting colors naturally. Reserve exact #00FF00 exclusively for the exterior chroma canvas.
    Constraints: no text, letters, numbers, brands, logos, watermark, glass, glow, transparent icon materials, cast shadow on the chroma canvas, or extra unrelated objects.
  product-icon-v3: |-
    Use case: stylized-concept
    Asset type: polished desktop app skill icon source
    Scene/backdrop: a perfectly flat solid #00FF00 chroma-key canvas visible only outside the app icon, with no shadows, gradients, texture, floor, or reflections.
    Structure: exactly three layers: the exterior chroma canvas; one complete opaque regular rounded-square icon base; one centered raised subject on that base.
    Base invariants: complete, centered, symmetrical rounded square with four identical corners and an unbroken silhouette. Never fold, clip, bend, cut, notch, hollow, warp, or deform it. Show the entire base with generous exterior padding.
    Subject invariants: use the specified physical metaphor. Do not turn the subject into generic paper, a floating card, a plaque, a dog-eared page, or a folded sheet. Any inherently folded object must be explicitly requested.
    Style/medium: fully finished high-quality 3D product icon with solid tactile materials, carefully modeled depth, soft studio light on the icon, and short contact shadows only between internal layers.
    Composition: square canvas, centered front view with slight dimensional depth, one bold subject readable at small size.
    Palette handling: follow the single broad base-color cue, then choose supporting colors naturally. Reserve exact #00FF00 exclusively for the exterior chroma canvas.
    Constraints: no text, letters, numbers, brands, logos, watermark, glass, glow, transparent icon materials, cast shadow on the chroma canvas, or extra unrelated objects.

