    template: product-icon-v0
    body: |-
      Primary request: Learn skill icon.
      Central subject: one unmistakable traditional graduation cap with a clearly visible mortarboard, fitted cap, and short tassel. The cap is a single strong silhouette centered as a separate solid object on the base.
      Material: matte ceramic with subtle tactile grain.
      Distinctness: do not use blue as the dominant base color. Do not add books, stairs, stars, bars, charts, light bulbs, or extra symbols.
  buddy-help:
    status: exact
    template: product-icon-v0
    referenceImage: "assets/mascot/buddy-mascot-headset.png"
    body: |-
      Primary request: Buddy Help skill icon generated from scratch.
      Reference image role: character identity reference only. Preserve the recognizable Buddy panda face, orange hoodie, and support headset; do not copy the reference background or crop.
      Central subject: a compact head-and-shoulders bust of Buddy wearing the headset, centered as a separate raised 3D figure on the complete rounded-square base. The mascot must not replace, merge with, or break the base.
      Material: solid molded mascot figure over a matte ceramic base.
      Distinctness: no question mark, speech bubble, text, book, star, stairs, cards, or blue-dominant base.
