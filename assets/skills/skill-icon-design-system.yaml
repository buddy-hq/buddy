schemaVersion: 1

asset:
  sourceBackground: "#00FF00"
  width: 512
  visibleContentMax: 400
  format: webp
  filenamePattern: "buddy-skill-{id}.webp"

render:
  style: "Finished 3D product icon"
  base: "Complete opaque regular rounded square with four even corners"
  lighting: "Soft studio lighting with short contact shadows"
  colorPrompt: "Give the image model exactly one short broad base-color cue; do not provide a full palette or multiple shade instructions"
  paletteRule: "Use only the first palette entry as the generation cue; remaining entries are post-generation atlas review notes"
  exactColorRule: "Never include literal color values in an image prompt except the exact #00FF00 exterior chroma-key canvas"
  avoid:
    - "folded, clipped, bent, cut, hollow, warped, or asymmetric bases"
    - "defaulting subjects to paper, cards, plaques, dog-eared corners, or folded sheets"
    - "glass, frost, chrome, holographic effects, bloom, lens flare, or glowing rims"
    - "third-party logos"

palette:
  navy: { label: "Navy", reviewDescription: "deep inky navy" }
  cobalt: { label: "Cobalt", reviewDescription: "confident saturated cobalt blue" }
  teal: { label: "Teal", reviewDescription: "calm botanical teal" }
  evergreen: { label: "Evergreen", reviewDescription: "rich forest evergreen" }
  plum: { label: "Plum", reviewDescription: "warm muted plum" }
  brick: { label: "Brick", reviewDescription: "earthy brick red" }
  amber: { label: "Amber", reviewDescription: "warm burnished amber" }
  slate: { label: "Slate", reviewDescription: "soft charcoal slate" }
  violet: { label: "Violet", reviewDescription: "restrained dusky violet" }
  coral: { label: "Coral", reviewDescription: "warm softened coral" }
  crimson: { label: "Crimson", reviewDescription: "deep scholarly crimson" }
  indigo: { label: "Indigo", reviewDescription: "dense blue-violet indigo" }
  cream: { label: "Cream", reviewDescription: "warm paper cream" }

