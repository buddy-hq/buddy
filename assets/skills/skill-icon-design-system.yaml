  - id: "whiteboard-authoring"
    status: "locked"
    displayName: "Whiteboard Authoring"
    purpose: "Author editable visual explanations and cumulative board work."
    symbol: "Raised whiteboard with nodes and a drawn curve"
    material: "Satin polymer"
    palette: [navy, cobalt, cream]
    lockedPrompt: |-
      Use case: logo-brand
      Asset type: square chroma-key master for Buddy's Whiteboard Authoring skill icon
      Primary request: create a finished 3D mini product icon on a perfectly flat #00FF00 chroma-key background. The icon itself must be a complete opaque dark-navy rounded square with four identical rounded corners, a regular centered square silhouette, and no folded, clipped, bent, cut, warped, or asymmetric edges. Center a smaller raised off-white whiteboard panel on it. The panel shows two navy circular diagram nodes connected by one straight navy line plus one raised cobalt dry-marker curve.
      Style/medium: premium 3D product icon, like a compact macOS app icon: solid satin plastic base, thick raised paper-like panel, subtle bevels, soft studio light, and short contact shadows only between layers. The base is opaque and solid, never glass or transparent.
      Composition/framing: centered icon with generous #00FF00 padding; the green exists only outside the rounded-square icon.
      Color palette: #00FF00 outside only; dark navy, off-white, and cobalt blue inside; no orange.
      Constraints: no text, letters, numbers, logos, watermark, mascot, character, glass, frosted material, chrome, holographic effects, glow, lens flare, floor plane, reflections, cast shadows on green, or extra objects.
