<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Provider Dialog - 25 Design Layout Matrix</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for diverse themes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..750&family=JetBrains+Mono:wght@100..800&family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&family=Sora:wght@100..800&family=Cinzel:wght@400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              cyber: ['"JetBrains Mono"', "monospace"],
              glass: ['"Sora"', '"Outfit"', "sans-serif"],
              serifHeading: ['"Cinzel"', "serif"],
              serifBody: ['"Lora"', "serif"],
              tui: ['"Space Mono"', "monospace"],
              playful: ['"Fredoka"', "sans-serif"],
            },
            animation: {
              "pulse-fast": "pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "terminal-blink": "blink 1.2s step-start infinite",
            },
            keyframes: {
              blink: {
                "50%": { opacity: "0" },
              },
            },
          },
        },
      }
    </script>

    <style>
      /* Custom Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.2);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.4);
      }

      /* Terminal Scanlines Overlay */
      .scanlines {
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.12) 50%);
        background-size: 100% 4px;
      }
    </style>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 flex flex-col font-sans overflow-hidden">
    <!-- Header -->
    <header
      class="border-b border-slate-800 bg-slate-900/80 backdrop-blur px-6 py-4 flex items-center justify-between flex-shrink-0 z-10"
    >
      <div class="flex items-center gap-3">
        <div
          class="h-8 w-8 rounded-lg bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/25"
        >
          <svg class="h-5 w-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"
            />
          </svg>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-white flex items-center gap-2">
            Connect Provider Dialog - 25 Layouts Playground
            <span
              class="text-xs font-mono font-medium px-2 py-0.5 rounded bg-slate-800 text-slate-400"
              >Exact Data Alignment</span
            >
          </h1>
          <p class="text-xs text-slate-400">
            Comparing 5 distinct visual styles against 5 actual UI information flows
          </p>
        </div>
      </div>

      <!-- View Toggler -->
      <div class="flex bg-slate-850 p-1 rounded-lg border border-slate-700">
        <button
          onclick="switchView('focus')"
          id="view-btn-focus"
          class="px-3.5 py-1 text-xs font-medium rounded bg-indigo-650 text-white transition-all"
        >
          🔎 Focus Explorer
        </button>
        <button
          onclick="switchView('matrix')"
          id="view-btn-matrix"
          class="px-3.5 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200 transition-all"
        >
          📊 5×5 Matrix View
        </button>
      </div>
    </header>

    <!-- Split Screen Workspace -->
    <main class="flex-1 flex overflow-hidden min-h-0">
      <!-- LEFT PANEL: React Simulator Engine -->
      <aside
        class="w-80 border-r border-slate-800 bg-slate-900/40 overflow-y-auto p-5 flex flex-col gap-5 flex-shrink-0"
      >
        <!-- Preset States matching React flows -->
        <div>
          <h2 class="text-[10px] font-bold tracking-widest text-slate-400 uppercase mb-2">
            React Preset States
          </h2>
          <div class="space-y-1.5">
            <button
              onclick="applyPreset('empty')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-350 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center"
            >
              <span>Empty State (No Providers)</span>
            </button>
            <button
              onclick="applyPreset('api-not-connected')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-355 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center"
            >
              <span>API Key (Not Connected)</span>
            </button>
            <button
              onclick="applyPreset('api-connected')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-355 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center"
            >
              <span>API Key (Connected)</span>
            </button>
            <button
              onclick="applyPreset('oauth-not-connected')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-355 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center"
            >
              <span>OAuth (Not Connected)</span>
            </button>
            <button
              onclick="applyPreset('oauth-code')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-355 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center"
            >
              <span>OAuth (Auth Code Form)</span>
            </button>
            <button
              onclick="applyPreset('oauth-waiting-env')"
              class="w-full text-left text-xs bg-slate-850 hover:bg-slate-800 text-slate-355 px-2.5 py-1.5 rounded border border-slate-700 transition-all flex justify-between items-center bg-amber-950/20"
            >
              <span>OAuth Waiting (Env + Error)</span>
            </button>
          </div>
        </div>

        <hr class="border-slate-800" />

        <!-- React State Variables Simulator -->
        <div class="flex-1 flex flex-col gap-4">
          <h2 class="text-[10px] font-bold tracking-widest text-slate-400 uppercase">
            React Component State
          </h2>

          <!-- Busy State -->
          <div
            class="flex items-center justify-between bg-slate-850/40 p-2 rounded border border-slate-800"
          >
            <span class="text-xs text-slate-400 font-medium">busy (Loading/Async)</span>
            <button
              id="sim-btn-busy"
              onclick="toggleBusy()"
              class="relative inline-flex h-5 w-9 items-center rounded-full bg-slate-700 transition-colors focus:outline-none"
            >
              <span
                class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform translate-x-1"
                id="sim-btn-busy-dot"
              ></span>
            </button>
          </div>

          <!-- Providers List Count -->
          <div>
            <label class="block text-xs text-slate-450 mb-1">providers.length</label>
            <div class="grid grid-cols-2 gap-2">
              <button
                id="btn-prov-0"
                onclick="setProvidersLength(0)"
                class="px-2 py-1 text-xs rounded bg-slate-850 border border-slate-700 text-slate-400"
              >
                0
              </button>
              <button
                id="btn-prov-3"
                onclick="setProvidersLength(3)"
                class="px-2 py-1 text-xs rounded bg-indigo-600 border border-indigo-500 text-white font-medium"
              >
                3
              </button>
            </div>
          </div>

          <!-- Selected Provider Details -->
          <div id="sim-provider-group" class="space-y-3">
            <div>
              <label class="block text-xs text-slate-450 mb-1"
                >providerID (Selected Provider)</label
              >
              <select
                id="sim-provider-select"
                onchange="selectProvider(this.value)"
                class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none"
              >
                <option value="openai">OpenAI (Connected: User, Source: User)</option>
                <option value="github">GitHub (Connected: User, Source: User)</option>
                <option value="anthropic">Anthropic (Connected: User, Source: User)</option>
              </select>
            </div>

            <!-- Provider metadata settings -->
            <div
              class="grid grid-cols-2 gap-2 bg-slate-850/30 p-2.5 rounded border border-slate-800"
            >
              <div class="flex flex-col gap-1">
                <span class="text-[10px] text-slate-500 uppercase">Connected</span>
                <button
                  onclick="toggleProviderConnected()"
                  id="sim-btn-prov-conn"
                  class="px-2 py-1 text-[11px] rounded bg-indigo-600 font-semibold text-white"
                >
                  true
                </button>
              </div>
              <div class="flex flex-col gap-1">
                <span class="text-[10px] text-slate-500 uppercase">Source</span>
                <button
                  onclick="toggleProviderSource()"
                  id="sim-btn-prov-src"
                  class="px-2 py-1 text-[11px] rounded bg-slate-700 font-semibold text-slate-300"
                >
                  user
                </button>
              </div>
            </div>
          </div>

          <!-- Auth Method Index -->
          <div id="sim-method-group">
            <label class="block text-xs text-slate-455 mb-1 font-medium"
              >methodIndex (Auth Method)</label
            >
            <select
              id="sim-method-select"
              onchange="selectMethodIndex(Number(this.value))"
              class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none"
            >
              <!-- options populated dynamically -->
            </select>
          </div>

          <!-- OAuth State Simulation -->
          <div id="sim-oauth-state-group" class="hidden space-y-2">
            <label class="block text-xs text-slate-455">OAuth state parameters</label>
            <div class="space-y-1 bg-slate-850/30 p-2.5 rounded border border-slate-800">
              <label class="flex items-center gap-2 text-xs text-slate-350">
                <input
                  type="radio"
                  name="sim-oauth-state"
                  value="none"
                  onchange="setOAuthState(this.value)"
                  checked
                  class="text-indigo-650"
                />
                <span>!authorization (Start Login)</span>
              </label>
              <label class="flex items-center gap-2 text-xs text-slate-350">
                <input
                  type="radio"
                  name="sim-oauth-state"
                  value="code"
                  onchange="setOAuthState(this.value)"
                />
                <span>authorization.method === "code"</span>
              </label>
              <label class="flex items-center gap-2 text-xs text-slate-350">
                <input
                  type="radio"
                  name="sim-oauth-state"
                  value="waiting"
                  onchange="setOAuthState(this.value)"
                />
                <span>authorization.method !== "code"</span>
              </label>
            </div>
          </div>

          <!-- Error State input -->
          <div>
            <label class="block text-xs text-slate-450 mb-1">error (String | undefined)</label>
            <input
              type="text"
              id="sim-error-input"
              oninput="setErrorText(this.value)"
              placeholder="No error active"
              class="w-full bg-slate-800 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none"
            />
          </div>
        </div>
      </aside>

      <!-- RIGHT PANEL: Display Workspace -->
      <section class="flex-1 flex flex-col overflow-hidden bg-slate-900/10">
        <!-- FOCUS EXPLORER: Navigation -->
        <div
          id="focus-nav-bar"
          class="border-b border-slate-800 bg-slate-950/60 p-3 flex flex-col gap-3 flex-shrink-0"
        >
          <!-- Themes selectors -->
          <div class="flex items-center gap-1.5 overflow-x-auto">
            <span
              class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-2 flex-shrink-0"
              >Visual Theme:</span
            >
            <button
              id="theme-btn-neo-brutalist"
              onclick="selectFocusTheme('neo-brutalist')"
              class="px-3 py-1.5 text-xs font-semibold rounded-md bg-slate-800 text-white border border-slate-700"
            >
              🌐 Neo-Brutalist
            </button>
            <button
              id="theme-btn-glassmorphic"
              onclick="selectFocusTheme('glassmorphic')"
              class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200"
            >
              ✨ Glassmorphic
            </button>
            <button
              id="theme-btn-warm-editorial"
              onclick="selectFocusTheme('warm-editorial')"
              class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200"
            >
              📜 Warm Editorial
            </button>
            <button
              id="theme-btn-terminal-tui"
              onclick="selectFocusTheme('terminal-tui')"
              class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200"
            >
              📟 TUI Terminal
            </button>
            <button
              id="theme-btn-playful-tactile"
              onclick="selectFocusTheme('playful-tactile')"
              class="px-3 py-1.5 text-xs font-medium rounded-md text-slate-400 hover:text-slate-200"
            >
              🎨 Playful Tactile
            </button>
          </div>

          <!-- Info Hierarchies selectors -->
          <div class="flex items-center gap-1.5 overflow-x-auto border-t border-slate-900 pt-2">
            <span
              class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mr-2 flex-shrink-0"
              >Info Hierarchy / Flow:</span
            >
            <button
              id="layout-btn-1"
              onclick="selectFocusLayout(1)"
              class="px-3.5 py-1 text-xs font-semibold rounded bg-slate-800 text-indigo-400 border border-slate-750"
            >
              Layout A: Split Dashboard
            </button>
            <button
              id="layout-btn-2"
              onclick="selectFocusLayout(2)"
              class="px-3.5 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200"
            >
              Layout B: Stepper Wizard
            </button>
            <button
              id="layout-btn-3"
              onclick="selectFocusLayout(3)"
              class="px-3.5 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200"
            >
              Layout C: Narrative Split
            </button>
            <button
              id="layout-btn-4"
              onclick="selectFocusLayout(4)"
              class="px-3.5 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200"
            >
              Layout D: Command Prompt CLI
            </button>
            <button
              id="layout-btn-5"
              onclick="selectFocusLayout(5)"
              class="px-3.5 py-1 text-xs font-medium rounded text-slate-400 hover:text-slate-200"
            >
              Layout E: Tactile index folder
            </button>
          </div>
        </div>

        <!-- WORKSPACE MOUNT -->
        <div
          class="flex-1 overflow-y-auto p-8 flex items-center justify-center min-h-0"
          id="render-mount"
        >
          <!-- Render targets dynamic mount -->
        </div>
      </section>
    </main>

    <!-- React Simulation Script -->
    <script>
      // Exact schema representation of local state variables in ConnectProviderDialog component
      const state = {
        currentView: "focus", // 'focus' or 'matrix'
        selectedThemeId: "neo-brutalist",
        selectedLayoutId: 1,

        // Component Props
        providers: [
          {
            id: "openai",
            name: "OpenAI",
            connected: false,
            source: "user", // 'user' or 'env'
            methods: [{ type: "api", label: "API Key Method" }],
          },
          {
            id: "github",
            name: "GitHub",
            connected: false,
            source: "user",

          },
          {
            id: "anthropic",
            name: "Anthropic",
            connected: false,
            source: "user",
            methods: [
              { type: "api", label: "Developer Token API" },
              { type: "oauth", label: "OAuth Console Authentication" },

          },

        providerID: "openai",
        methodIndex: 0,
        authorization: null, // null | ProviderAuthAuthorization
        apiKey: "",
        code: "",
        busy: false,
        error: undefined,
      }

      // Styling configurations mapping to CSS tokens
      const themeStyles = {

      function applyPreset(name) {
        const p = presets[name]
        if (!p) return

        state.providersLength = p.providersLength
        state.providerID = p.providerID
        state.methodIndex = p.methodIndex
        state.apiKey = p.apiKey
        state.code = p.code
        state.busy = p.busy
        state.error = p.error
        state.authorization = p.authorization

        // Sync active provider variables
        const prov = state.providers.find((x) => x.id === state.providerID)
        if (prov) {
          prov.connected = p.connected
          prov.source = p.source
        }

        updateControlsUI()
        renderWorkspace()
      }

      // Toggle Variables Simulator UI
      function updateControlsUI() {
        // Busy state
        const busyDot = document.getElementById("sim-btn-busy-dot")
        const busyBtn = document.getElementById("sim-btn-busy")
        if (state.busy) {
          busyBtn.classList.remove("bg-slate-700")
          busyBtn.classList.add("bg-indigo-650")
          busyDot.classList.remove("translate-x-1")
          busyDot.classList.add("translate-x-5")
        } else {
          busyBtn.classList.remove("bg-indigo-650")
          busyBtn.classList.add("bg-slate-700")
          busyDot.classList.remove("translate-x-5")
          busyDot.classList.add("translate-x-1")
        }

        // Providers list
        const p0 = document.getElementById("btn-prov-0")
        const p3 = document.getElementById("btn-prov-3")
        const provSelectGroup = document.getElementById("sim-provider-group")
        const methodSelectGroup = document.getElementById("sim-method-group")
        const oauthStateGroup = document.getElementById("sim-oauth-state-group")

        if (state.providersLength === 0) {
          p0.className =
            "px-2 py-1 text-xs rounded bg-indigo-650 border border-indigo-500 text-white font-medium"
          p3.className =
            "px-2 py-1 text-xs rounded bg-slate-800 border border-slate-700 text-slate-400"
          provSelectGroup.classList.add("hidden")
          methodSelectGroup.classList.add("hidden")
          oauthStateGroup.classList.add("hidden")
        } else {
          p0.className =
            "px-2 py-1 text-xs rounded bg-slate-800 border border-slate-700 text-slate-400"
          p3.className =
            "px-2 py-1 text-xs rounded bg-indigo-650 border border-indigo-500 text-white font-medium"
          provSelectGroup.classList.remove("hidden")
          methodSelectGroup.classList.remove("hidden")
        }

        // Provider values
        document.getElementById("sim-provider-select").value = state.providerID
        const activeProvider = state.providers.find((p) => p.id === state.providerID)

        if (activeProvider) {
          const btnConn = document.getElementById("sim-btn-prov-conn")
          btnConn.innerText = String(activeProvider.connected)
          btnConn.className = activeProvider.connected
            ? "px-2 py-1 text-[11px] rounded bg-indigo-660 text-white font-semibold"
            : "px-2 py-1 text-[11px] rounded bg-slate-750 text-slate-400 border border-slate-700"

          const btnSrc = document.getElementById("sim-btn-prov-src")
          btnSrc.innerText = activeProvider.source
          btnSrc.className =
            activeProvider.source === "env"
              ? "px-2 py-1 text-[11px] rounded bg-amber-600 text-white font-semibold"
              : "px-2 py-1 text-[11px] rounded bg-slate-700 text-slate-350"

          // Method options list
          const methodsSelect = document.getElementById("sim-method-select")
          methodsSelect.innerHTML = ""
          activeProvider.methods.forEach((m, idx) => {
            const opt = document.createElement("option")
            opt.value = String(idx)
            opt.text = m.label
            methodsSelect.appendChild(opt)
          })
          methodsSelect.value = String(state.methodIndex)

          // Disconnect Toggles status
          const canDisconnect = activeProvider.connected && activeProvider.source !== "env"
          const discDot = document.getElementById("sim-btn-disconnect-dot")
          const discBtn = document.getElementById("sim-btn-disconnect")
          if (canDisconnect) {
            discBtn.classList.remove("bg-slate-700")
            discBtn.classList.add("bg-indigo-650")
            discDot.classList.remove("translate-x-1")
            discDot.classList.add("translate-x-5")
          } else {
            discBtn.classList.remove("bg-indigo-650")
            discBtn.classList.add("bg-slate-700")
            discDot.classList.remove("translate-x-5")
            discDot.classList.add("translate-x-1")
          }

          const envManaged = activeProvider.connected && activeProvider.source === "env"
          const envDot = document.getElementById("sim-btn-env-dot")
          const envBtn = document.getElementById("sim-btn-env")
          if (envManaged) {
            envBtn.classList.remove("bg-slate-700")
            envBtn.classList.add("bg-indigo-650")
            envDot.classList.remove("translate-x-1")
            envDot.classList.add("translate-x-5")
          } else {
            envBtn.classList.remove("bg-indigo-650")
            envBtn.classList.add("bg-slate-700")
            envDot.classList.remove("translate-x-5")
            envDot.classList.add("translate-x-1")
          }

          // OAuth state radio sync
          const activeMethod =
            activeProvider.methods[state.methodIndex] || activeProvider.methods[0]
          if (activeMethod && activeMethod.type === "oauth") {
            oauthStateGroup.classList.remove("hidden")
            const radios = document.getElementsByName("sim-oauth-state")
            let val = "none"
            if (state.authorization) {
              val = state.authorization.method === "code" ? "code" : "waiting"
            }
            for (let r of radios) {
              r.checked = r.value === val
            }
          } else {
            oauthStateGroup.classList.add("hidden")
          }
        }

        document.getElementById("sim-error-input").value = state.error || ""
      }

      }
      function globalSelectMethodIndex(val) {
        selectMethodIndex(Number(val))
      }
      function globalHandleAPIKeyChange(val) {
        state.apiKey = val
      }
      function globalHandleOAuthCodeChange(val) {
        state.code = val
      }

      function globalHandleApiSubmit() {
        if (!state.providerID) return
        state.busy = true
        state.error = undefined
        updateControlsUI()
        renderWorkspace()

        setTimeout(() => {
          state.busy = false
          const activeProvider = state.providers.find((p) => p.id === state.providerID)
          if (activeProvider) {
            activeProvider.connected = true
            activeProvider.source = "user"
          }
          updateControlsUI()
          renderWorkspace()
          alert("Success: Saved credentials & reloaded runtime.")
        }, 1200)
      }

      function globalHandleDisconnect() {
        if (!state.providerID) return
        state.busy = true
        state.error = undefined
        updateControlsUI()
        renderWorkspace()

        setTimeout(() => {
          state.busy = false
          const activeProvider = state.providers.find((p) => p.id === state.providerID)
          if (activeProvider) {
            activeProvider.connected = false
            activeProvider.source = "user"
          }
          state.authorization = null
          state.apiKey = ""
          state.code = ""
          updateControlsUI()
          renderWorkspace()
          alert("Success: Disconnected and removed credential keys.")
        }, 1200)
      }

        if (!state.providerID) return
        state.busy = true
        state.error = undefined
        state.authorization = null
        updateControlsUI()
        renderWorkspace()

        setTimeout(() => {
          state.busy = false

        if (!state.providerID) return
        state.busy = true
        state.error = undefined
        updateControlsUI()
        renderWorkspace()

          state.busy = false

      // THE 5 INDEPENDENT HIERARCHICAL LAYOUTS IMPLEMENTATION
      function renderLayoutTemplate(layoutId, theme, themeKey, state) {
        // 1. Props & State mappings
        const selectedProvider = state.providers.find((p) => p.id === state.providerID)
        const methods = selectedProvider
          ? selectedProvider.methods.length > 0
            ? selectedProvider.methods
            : [{ type: "api", label: "API Key Method" }]
          : []
        const selectedMethod = methods[state.methodIndex] ?? methods[0]

        const canDisconnect =
          selectedProvider && selectedProvider.connected && selectedProvider.source !== "env"
        const envManaged =
          selectedProvider && selectedProvider.connected && selectedProvider.source === "env"

        let confirmationCode = ""
        if (state.authorization && state.authorization.instructions) {
          // Simple extraction mock matching parseProviderConfirmationCode
          const match = state.authorization.instructions.match(/CONFIRMATION_CODE:\s*([^\s]+)/)
          if (match) confirmationCode = match[1]
        }

        // Check loading statuses
        const isApi = selectedMethod && selectedMethod.type === "api"
        const isOauth = selectedMethod && selectedMethod.type === "oauth"
        const hasMultipleMethods = methods.length > 1

        // Label mappings matching React language translations
        const labels = {
          title: "Connect Provider",
          description: "Configure credentials for your notebook providers.",
          noProviders: "No providers available for this notebook",
          providerLabel: "Provider",
          authMethodLabel: "Auth Method",
          apiKeyLabel: "API Key",
          apiKeyPlaceholder: `Enter API Key for ${selectedProvider ? selectedProvider.name : "Provider"}`,
          saveCredentials: state.busy ? "Saving..." : "Save Credentials",
          disconnect: "Disconnect",
          envDisconnectHelp: "To disconnect, remove the environment variable and reload Buddy.",
          startLogin: state.busy ? "Waiting for authorization..." : "Start Login",
          authorizationLinkLabel: "Authorization Link",
          authorizationHelpPrefix: `Authorize Buddy to access ${selectedProvider ? selectedProvider.name : "Provider"}.`,
          openAuthorizationPage: "Open Authorization Page",
          authorizationCodeLabel: "Authorization Code",
          authorizationCodePlaceholder: "Enter authorization code",
          submitCode: state.busy ? "Continuing in browser..." : "Submit Code",
          confirmationCodeLabel: "Confirmation Code",
          waitingForAuthorization: "Waiting for authorization...",
          connectedAsReadOnly: "Connected as read-only",
        }

        // Empty State
        if (state.providersLength === 0) {
          return `
          <div class="${theme.card} w-full max-w-md min-h-[250px] flex flex-col justify-center items-center text-center">
            <span class="text-3xl mb-2">🏜️</span>
            <h4 class="${theme.title} mb-2">${labels.title}</h4>
            <p class="${labels.noProviders} ${theme.desc} max-w-xs">${labels.noProviders}</p>
          </div>
        `
        }

        // Error banner
        const errorBoxHTML = state.error
          ? `
        <div class="${theme.errorBox} mb-4">
          <span class="font-extrabold uppercase">Alert:</span> <span>${state.error}</span>
        </div>
      `
          : ""

        // Connection Status text display
        let connectionBadgeText = ""
        if (selectedProvider && selectedProvider.connected) {
          connectionBadgeText = envManaged ? "Connected via environment variables" : "Connected"
        } else {
          connectionBadgeText = "Not connected"
        }

        // ----------------------------------------------------
        // LAYOUT 1: SPLIT DASHBOARD LAYOUT (Side-by-Side balanced layout)
        // ----------------------------------------------------
        if (layoutId === 1) {
          let authFormHTML = ""
          if (isApi) {
            authFormHTML = `
            <div class="space-y-3 pt-2">
              <div>
                <label class="block text-[10px] opacity-75 mb-1">${labels.apiKeyLabel}</label>
                <input type="password" value="${state.apiKey}" oninput="globalHandleAPIKeyChange(this.value)" placeholder="${labels.apiKeyPlaceholder}" class="${theme.input}" ${state.busy ? "disabled" : ""}>

              : "bg-slate-200 text-slate-500 border-slate-300 translate-y-1 hover:bg-slate-100"
            tactileTabsHTML += `
            <button onclick="globalSelectProvider('${p.id}')" class="px-3.5 py-1.5 text-[10px] font-black border-3 border-b-0 rounded-t-2xl transition-all transform ${bgClass}" ${state.busy ? "disabled" : ""}>
              ${p.name}
            </button>
          `
          })

          let switchesHTML = ""
          if (hasMultipleMethods) {
            switchesHTML = `
            <div class="flex items-center justify-between bg-slate-50 border-3 border-slate-800 p-2 rounded-xl mb-3.5">
              <span class="text-[10px] font-black text-slate-500 uppercase pl-1">${labels.authMethodLabel} Dial</span>
              <div class="flex gap-1">
                ${methods
                  .map((m, idx) => {
                    const isActive = idx === state.methodIndex
                    const activeClass = isActive
                      ? "bg-yellow-400 text-slate-800 border-slate-800"
                      : "bg-slate-100 text-slate-400 border-slate-250"
                    return `<button onclick="globalSelectMethodIndex(${idx})" class="px-2.5 py-1 text-[9px] font-black border-2 rounded-lg transition-all ${activeClass}" ${state.busy ? "disabled" : ""}>${m.label}</button>`
                  })
                  .join("")}
              </div>
            </div>
          `
          }

          let innerPocketHTML = ""
          if (isApi) {
            innerPocketHTML = `
            <div class="space-y-3 pt-1">
              <div>
                <label class="block text-[10px] font-black text-slate-450 uppercase mb-1 pl-1">${labels.apiKeyLabel}</label>
                <input type="password" value="${state.apiKey}" oninput="globalHandleAPIKeyChange(this.value)" placeholder="${labels.apiKeyPlaceholder}" class="${theme.input}" ${state.busy ? "disabled" : ""}>
              </div>
              <div class="flex gap-2">
                <button onclick="globalHandleApiSubmit()" class="${theme.btnPrimary} flex-1" ${state.busy ? "disabled" : ""}>${labels.saveCredentials}</button>
                ${canDisconnect ? `<button onclick="globalHandleDisconnect()" class="${theme.btnDanger}" ${state.busy ? "disabled" : ""}>${labels.disconnect}</button>` : ""}
              </div>
              ${envManaged ? `<p class="text-[9px] text-slate-500 font-bold leading-normal pt-1">${labels.envDisconnectHelp}</p>` : ""}
            </div>
          `
          } else {
            const showStart = !state.authorization || state.authorization.method !== "code"
            innerPocketHTML = `
            <div class="space-y-3 pt-1">
              ${showStart ? `<button onclick="globalHandleStartOAuth()" class="${theme.btnPrimary} w-full" ${state.busy ? "disabled" : ""}>${labels.startLogin}</button>` : ""}
              
              ${
                state.authorization
                  ? `
                <div class="${theme.subCard} space-y-2">
                  <span class="text-[9px] font-black text-slate-400 block">${labels.authorizationLinkLabel}</span>
                  <p class="text-[11px] text-slate-550 leading-tight">${labels.authorizationHelpPrefix}</p>
                  <a href="${state.authorization.url}" target="_blank" class="${theme.textLink} truncate block font-bold py-0.5">${labels.openAuthorizationPage}</a>
                  
                  ${
                    state.authorization.method === "code"
                      ? `
                    <div class="space-y-1.5 border-t-3 border-slate-100 pt-2">
                      <label class="block text-[9px] font-black text-slate-450 uppercase">${labels.authorizationCodeLabel}</label>
                      <div class="flex gap-2">
                        <input type="text" value="${state.code}" oninput="globalHandleOAuthCodeChange(this.value)" placeholder="${labels.authorizationCodePlaceholder}" class="${theme.input} flex-1" ${state.busy ? "disabled" : ""}>
                        <button onclick="globalHandleSubmitOAuthCode()" class="${theme.btnPrimary}" ${state.busy ? "disabled" : ""}>Verify</button>
                      </div>
                    </div>
                  `
                      : ""
                  }

                  ${
                    state.authorization.method === "waiting"
                      ? `
                    <div class="space-y-2 border-t-3 border-slate-100 pt-2">
                      ${
                        confirmationCode
                          ? `
                        <p class="text-[9px] font-black text-slate-400">${labels.confirmationCodeLabel}</p>
                        <input type="text" readOnly value="${confirmationCode}" class="${theme.input} text-center font-bold">
                      `
                          : ""
                      }
                      <p class="text-[10px] text-amber-500 font-bold animate-pulse-fast">${labels.waitingForAuthorization}</p>
                    </div>
                  `
                      : ""
                  }
                </div>
              `
                  : ""
              }

              <div class="flex flex-col gap-1.5 pt-2 border-t-3 border-slate-100">
                ${canDisconnect ? `<button onclick="globalHandleDisconnect()" class="${theme.btnDanger} w-full" ${state.busy ? "disabled" : ""}>${labels.disconnect}</button>` : ""}
                ${envManaged ? `<span class="block text-[9px] text-slate-500 font-bold text-center uppercase tracking-wider">${labels.connectedAsReadOnly}</span>` : ""}
              </div>
            </div>
          `
          }

          return `
          <div class="w-full max-w-md font-playful relative">
            <div class="flex gap-1.5 pl-4 -mb-1 relative z-10">
              ${tactileTabsHTML}
            </div>
            
            <div class="border-4 border-slate-800 bg-white text-slate-800 p-6 rounded-[24px] rounded-tl-none shadow-[6px_6px_0px_rgba(30,41,59,1)]">
              <!-- status representation -->
              <div class="flex justify-between items-center bg-slate-50 border-3 border-slate-800 p-2.5 rounded-xl mb-4">
                <span class="text-[10px] font-black text-slate-500 uppercase pl-1">Light Status</span>
                <div class="flex items-center gap-1.5 pr-1 font-bold text-xs">
                  <span class="w-3.5 h-3.5 rounded-full border-2 border-slate-800 ${selectedProvider && selectedProvider.connected ? (envManaged ? "bg-amber-455 shadow-[0_0_6px_#f59e0b]" : "bg-emerald-400 shadow-[0_0_6px_#10b981]") : "bg-slate-300"}"></span>
                  <span>${connectionBadgeText}</span>
                </div>
              </div>

              ${errorBoxHTML}

              <div>
                ${switchesHTML}
                ${innerPocketHTML}
              </div>
            </div>
          </div>
        `
        }
      }
    </script>
  </body>
</html>
